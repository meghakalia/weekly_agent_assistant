services:
  # Backend API Service
  - type: web
    name: weekly-grocery-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.main:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --log-level info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
      - key: OUTPUT_DIR
        value: /tmp
      - key: PYTHONUNBUFFERED
        value: 1
      # Add your API keys in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
